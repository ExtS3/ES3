<!DOCTYPE html>
<html class="light" lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ES3 · 초기 계정 정보 변경</title>
<script src="/static/vendor/tailwindcss-forms-container-queries.js"></script>
<script src="/static/js/es3-theme.js"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="/static/css/common/tokens.css">
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-6 font-body">
<main class="w-full max-w-md bg-surface-container-lowest rounded-2xl shadow-lg shadow-slate-200/60 overflow-hidden" aria-labelledby="change-credentials-title">
  <div class="es3-gradient-bg h-1" aria-hidden="true"></div>
  <div class="p-8">
    <img src="/static/img/logo.png" alt="ES3" class="h-12 mx-auto">
    <h1 id="change-credentials-title" class="mt-5 text-2xl font-bold text-center">초기 계정 정보 변경</h1>
    <p class="mt-1 text-sm text-on-surface-variant text-center">계속 이용하려면 기본 관리자 아이디와 비밀번호를 변경하세요.</p>

    <form id="changeCredentialsForm" class="mt-8 space-y-5">
      <div>
        <label class="block text-sm font-semibold mb-2" for="newUsername">새 아이디</label>
        <input id="newUsername" autocomplete="username" minlength="3" maxlength="64" required
               class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary">
      </div>
      <div>
        <label class="block text-sm font-semibold mb-2" for="newPassword">새 비밀번호</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="10" maxlength="256" required
               class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary">
      </div>
      <button type="submit"
              class="w-full bg-primary hover:bg-primary-dim text-white rounded-lg px-4 py-3 font-bold transition-colors">계정 정보 저장</button>
    </form>
    <p id="changeCredentialsMessage" class="mt-4 text-sm text-on-surface-variant text-center" aria-live="polite"></p>
  </div>
</main>
<script src="/static/js/auth/change_credentials.js"></script>
</body>
</html>
