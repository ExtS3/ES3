<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ES3 · 라이브러리</title>
<script src="/static/vendor/tailwindcss-forms-container-queries.js"></script>
<script src="/static/js/es3-theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body { font-family: 'Pretendard', 'Inter', sans-serif; }
        .line-clamp-2 {
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }
        .library-menu-item {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 0.75rem;
            text-align: left;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--es3-ink);
        }
        .library-menu-item:hover {
            background: var(--es3-primary-soft);
        }
    </style>
<link rel="stylesheet" href="/static/css/common/tokens.css">
<link rel="stylesheet" href="/static/css/common/nav.css">
</head>
<body class="bg-surface text-on-surface min-h-screen">
<header id="es3-header" class="fixed"></header>
<aside id="es3-sidebar" class="fixed"></aside>
<!-- Main Content -->
<main class="md:pl-60 pt-20">
<div class="max-w-7xl mx-auto px-8 pb-12">
<!-- Header Section -->
<header class="mb-10">
<h1 class="text-3xl font-bold tracking-tight text-on-surface mb-2">내 라이브러리 관리</h1>
<p class="text-on-surface-variant max-w-2xl">설치된 모든 확장 프로그램과 앱의 상태를 한눈에 확인하고 업데이트나 삭제를 관리할 수 있습니다.</p>
</header>
<!-- Stats Grid -->
<section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
  <div class="bg-surface-container-lowest border border-outline-variant p-6 rounded-xl flex items-center gap-4">
    <div class="w-12 h-12 shrink-0 rounded-xl bg-primary-container text-primary flex items-center justify-center">
      <span class="material-symbols-outlined">inventory_2</span>
    </div>
    <div>
      <span class="block text-sm font-medium text-on-surface-variant">총 설치 항목</span>
      <span id="stat-total-count" class="text-3xl font-bold text-on-surface">0</span>
    </div>
  </div>

  <div class="bg-surface-container-lowest border border-outline-variant p-6 rounded-xl flex items-center gap-4">
    <div class="w-12 h-12 shrink-0 rounded-xl bg-primary-container text-primary flex items-center justify-center">
      <span class="material-symbols-outlined">update</span>
    </div>
    <div>
      <span class="flex items-center gap-2 text-sm font-medium text-on-surface-variant">업데이트 필요
        <span id="update-pulse" class="flex h-2 w-2 rounded-full bg-error animate-pulse hidden"></span>
      </span>
      <span id="stat-update-count" class="text-3xl font-bold text-on-surface">0</span>
    </div>
  </div>

</section>
<!-- Management List -->
<section class="space-y-4">
    <div class="flex flex-col gap-4 mb-4 lg:flex-row lg:items-center lg:justify-between">
        <h3 class="text-lg font-semibold text-on-surface">설치 가능한 확장 프로그램 목록</h3>
        <form id="library-search-form" class="flex w-full max-w-md items-center gap-2" role="search">
          <label class="sr-only" for="library-search-input">확장 프로그램 이름</label>
          <div class="relative flex-1">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">search</span>
            <input
              id="library-search-input"
              class="w-full rounded-lg border border-outline-variant bg-white py-2 pl-10 pr-3 text-sm text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20"
              name="extName"
              placeholder="확장 프로그램 이름으로 검색"
              type="search"
            />
          </div>
          <button class="es3-btn es3-btn-ghost h-10" type="submit">
            <span class="material-symbols-outlined text-sm">search</span>
            검색
          </button>
          <a id="library-search-clear" class="hidden h-10 items-center rounded-lg px-3 text-sm font-semibold text-on-surface-variant hover:bg-surface-container" href="/library">초기화</a>
        </form>
        </div>

    <div id="nexus-item-list" class="space-y-3">
        </div>

    <div id="pagination-controls" class="flex justify-center items-center gap-2 mt-8">
        </div>
</section>






</div>
</main>
<!-- Mobile Navigation Bar -->
<nav class="md:hidden fixed bottom-0 w-full bg-white/80 backdrop-blur-md px-6 py-3 flex justify-around items-center z-50 border-t border-outline-variant">
<button class="flex flex-col items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-[10px] font-medium">홈</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="explore">explore</span>
<span class="text-[10px] font-medium">탐색</span>
</button>
<button class="flex flex-col items-center gap-1 text-primary">
<span class="material-symbols-outlined" data-icon="inventory_2" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
<span class="text-[10px] font-bold">라이브러리</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="text-[10px] font-medium">프로필</span>
</button>
</nav>
</body>

<input type="file" id="demoUploadFile" style="display: none;">
<script src="/static/js/common.js?v=es3-5"></script>
<script src="/static/js/upload.js"></script>
<script src="/static/js/library/library.js?v=es3-1"></script>
</html>
