<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ES3 · 업로드</title>
<script src="/static/vendor/tailwindcss-forms-container-queries.js"></script>
<script src="/static/js/es3-theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Pretendard', 'Inter', sans-serif; }
    </style>
<link rel="stylesheet" href="/static/css/common/tokens.css">
<link rel="stylesheet" href="/static/css/common/nav.css">
</head>
<body class="bg-surface text-on-surface min-h-screen">
<header id="es3-header" class="fixed"></header>
<aside id="es3-sidebar" class="fixed"></aside>
<!-- Main Content -->
<main class="md:pl-60 pt-20">
<div class="max-w-7xl mx-auto px-8 pb-12">
<header class="mb-10 max-w-5xl mx-auto flex justify-between items-end">
<div>
<nav class="flex items-center gap-2 text-sm text-on-surface-variant mb-2">
<span>내 파일 업로드</span>

<span class="mx-1 text-outline">|</span>
      <div class="flex items-center gap-1.5 px-2 py-0.5 bg-surface-container-high rounded-md border border-outline-variant/20 group cursor-pointer hover:border-primary/50 transition-colors">
        <span class="material-symbols-outlined text-[16px] text-on-surface-variant">description</span>
        <span id="selectFile" class="text-xs font-mono text-on-surface">N/A</span>
        <span class="material-symbols-outlined text-[14px] text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity">edit</span>
      </div>
      <button id="selectBuildFile" class="px-3 py-1 border border-outline-variant text-on-surface text-sm font-semibold rounded-lg hover:bg-primary-container hover:text-on-primary-container transition-colors">파일 선택</button>

</nav>
<h1 class="text-4xl font-extrabold tracking-tight text-on-surface">설정</h1>
<p class="mt-2 text-on-surface-variant max-w-2xl">프로그램 업로드 전, 검사를 위한 설정을 입력하세요.</p>
</div>
<div class="flex gap-3">
<button class="px-6 py-2.5 rounded-xl border border-outline-variant text-on-surface font-semibold text-sm hover:bg-surface-container-low transition-colors">취소</button>
<button id="buildBtn" class="px-6 py-2.5 rounded-xl bg-primary text-on-primary font-semibold text-sm shadow-md hover:translate-y-[-1px] active:translate-y-0 transition-all">검사 실행</button>
</div>



<!--    예쁜>< 확인창           -->

<div id="custom-confirm-modal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center">
    <div id="modal-backdrop" class="absolute inset-0 bg-black/50 opacity-0 transition-opacity duration-300"></div>
    
    <div id="modal-content" class="relative bg-surface-container-high rounded-[28px] p-6 shadow-2xl max-w-sm w-full mx-4 scale-90 opacity-0 transition-all duration-300">
        <div class="flex flex-col items-center text-center gap-4">
            <div id="modal-icon-container" class="p-3 rounded-full">
                <span id="modal-icon" class="material-symbols-rounded text-3xl text-inherit"></span>
            </div>
            
            <div class="space-y-2">
                <h3 id="modal-title" class="text-2xl font-semibold text-on-surface"></h3>
                <p id="modal-message" class="text-sm text-on-surface-variant leading-relaxed"></p>
            </div>

            <div class="flex gap-3 w-full mt-2">
                <button id="modal-cancel-btn" class="flex-1 px-5 py-2.5 rounded-full text-sm font-semibold text-primary hover:bg-primary/5 transition-colors">
                    취소
                </button>
                <button id="modal-confirm-btn" class="flex-1 px-5 py-2.5 rounded-full text-sm font-semibold transition-colors shadow-sm">
                    확인
                </button>
            </div>
        </div>
    </div>
</div>


<!--------------------->

</header>
<div class="max-w-5xl mx-auto grid grid-cols-12 gap-6">

    <section class="col-span-12 bg-surface-container-lowest rounded-xl p-8 border border-outline-variant/10 shadow-sm mb-6">
    <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center">
            <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">extension</span>
        </div>
        <h3 class="text-xl font-bold">확장 프로그램 정보 (Extension Info)</h3>
    </div>

    <!-- 업로드 모드 선택 -->
    <div class="mb-6">
        <label class="text-sm font-semibold text-on-surface-variant ml-1 block mb-2">업로드 유형</label>
        <div class="inline-flex p-1 bg-surface-container-low rounded-xl gap-1">
            <button type="button" id="mode-first"
                    class="px-5 py-2 rounded-lg text-sm font-semibold transition-colors bg-primary text-on-primary">
                첫 업로드
            </button>
            <button type="button" id="mode-update"
                    class="px-5 py-2 rounded-lg text-sm font-semibold transition-colors text-on-surface-variant hover:bg-surface-container">
                추가 업로드
            </button>
        </div>
        <p id="mode-hint" class="text-xs text-on-surface-variant mt-2 ml-1">새로운 확장을 처음 업로드합니다. 버전은 자동으로 1.0.0으로 설정됩니다.</p>
    </div>

    <!-- 추가 업로드: 내 확장 선택 -->
    <div id="update-select-wrap" class="hidden mb-6 space-y-2">
        <label class="text-sm font-semibold text-on-surface-variant ml-1">업로드한 확장 선택</label>
        <div class="relative">
            <select id="extSelect" class="w-full bg-surface-container-low border-none rounded-xl py-3 px-4 text-sm appearance-none focus:ring-2 focus:ring-primary/20">
                <option value="">불러오는 중...</option>
            </select>
            <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="space-y-2">
            <label class="text-sm font-semibold text-on-surface-variant ml-1">확장 프로그램 이름</label>
            <input type="text" id="extName" name="extName" placeholder="예: My Extension"
                   class="w-full bg-surface-container-low border-none rounded-xl py-3 px-4 text-sm focus:ring-2 focus:ring-primary/20">
        </div>

        <div class="space-y-2">
            <label class="text-sm font-semibold text-on-surface-variant ml-1">버전 (자동)</label>
            <input type="text" id="version" name="version" value="1.0.0" readonly
                   class="w-full bg-surface-container border-none rounded-xl py-3 px-4 text-sm text-on-surface-variant cursor-not-allowed focus:ring-0">
        </div>

        <div class="space-y-2">
            <label class="text-sm font-semibold text-on-surface-variant ml-1">브라우저</label>
            <div class="relative">
                <select id="browser" name="browser" class="w-full bg-surface-container-low border-none rounded-xl py-3 px-4 text-sm appearance-none focus:ring-2 focus:ring-primary/20">
                    <option value="Chrome">Google Chrome</option>
                    <option value="edge">Microsoft Edge</option>
                    <option value="firefox">Mozilla Firefox</option>
                    <option value="opera">Opera</option>
                </select>
                <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
            </div>
        </div>
    </div>
    <input type="hidden" id="extID" name="extID" value="">
</section>

</div>
</div>
</main>
</body>

<input type="file" id="UploadFile" style="display: none;">

<script src="/static/js/common.js?v=es3-10"></script>
<script src="/static/js/upload.js"></script>
<script src="/static/js/upload/build.js?v=20260612-upload-modes"></script>

</html>
