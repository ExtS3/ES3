<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ES3 · 앱 탐색</title>
<script src="/static/vendor/tailwindcss-forms-container-queries.js"></script>
<script src="/static/js/es3-theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body { font-family: 'Pretendard', 'Inter', sans-serif; }
        /* 플랫폼 선택 칩 — 아이콘 위주, 선택 상태는 색만으로 읽히게 */
        .browser-btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 18px; border-radius: 999px; cursor: pointer;
            background: #fff; border: 1px solid var(--es3-line);
            font: 600 14px/1.25 'Pretendard', 'Inter', sans-serif;
            color: var(--es3-muted);
            transition: border-color var(--es3-ease), background var(--es3-ease), color var(--es3-ease);
        }
        .browser-btn:hover { border-color: var(--es3-primary); color: var(--es3-primary-strong); }
        .browser-btn.active {
            border-color: var(--es3-primary);
            background: var(--es3-primary-soft);
            color: var(--es3-primary-strong);
        }
    </style>
<link rel="stylesheet" href="/static/css/common/nav.css">
<link rel="stylesheet" href="/static/css/common/tokens.css">
</head>
<body class="bg-surface text-on-surface antialiased">
<header id="es3-header" class="fixed"></header>
<aside id="es3-sidebar" class="fixed"></aside>


<!-- Main Content Canvas — 구글식: 검색 하나만 보이게 -->
<main class="md:pl-60 pt-20 min-h-screen flex flex-col items-center justify-center px-6 pb-24 relative overflow-hidden">
<div class="absolute inset-0 pointer-events-none overflow-hidden -z-10">
<div class="absolute -top-24 right-[12%] w-96 h-96 rounded-full bg-primary/10 blur-3xl"></div>
<div class="absolute -bottom-24 left-[18%] w-96 h-96 rounded-full bg-[#A06AF0]/10 blur-3xl"></div>
</div>

<div class="w-full max-w-2xl flex flex-col items-center space-y-8">

  <!-- 로고 = 페이지 아이덴티티 (구글 로고 자리) -->
  <img src="/static/img/logo-trans.png" alt="ES3" class="h-24">

  <!-- 검색 바 -->
  <div class="relative w-full">
    <div class="absolute inset-y-0 left-6 flex items-center pointer-events-none">
      <span class="material-symbols-outlined text-on-surface-variant text-2xl" data-icon="search">search</span>
    </div>
    <input id="searchInput" autofocus
           class="w-full pl-16 pr-16 py-5 bg-white border border-outline-variant rounded-full shadow-sm text-lg focus:outline-none focus:ring-4 focus:ring-primary/10 focus:border-primary transition-colors placeholder:text-on-surface-variant hover:border-primary"
           placeholder="확장 프로그램 이름 또는 ID 검색" type="text"/>
    <button id="exploreBtn" aria-label="검색"
            class="absolute inset-y-0 right-3 my-auto w-11 h-11 flex items-center justify-center rounded-full bg-primary text-white hover:bg-primary-dim transition-colors">
      <span class="material-symbols-outlined">arrow_forward</span>
    </button>
  </div>

  <!-- 플랫폼 선택 — 아이콘만으로 읽히는 칩 2개 -->
  <div id="browserFilter" class="flex items-center gap-3">
    <button class="browser-btn active" data-name="Chrome">
      <svg viewBox="0 0 24 24" class="w-5 h-5" aria-hidden="true">
        <path fill="#EA4335" d="M12 12 L3.34 7 A10 10 0 0 1 20.66 7 Z"/>
        <path fill="#FBBC05" d="M12 12 L20.66 7 A10 10 0 0 1 12 22 Z"/>
        <path fill="#34A853" d="M12 12 L12 22 A10 10 0 0 1 3.34 7 Z"/>
        <circle cx="12" cy="12" r="5.4" fill="#fff"/>
        <circle cx="12" cy="12" r="4.2" fill="#4285F4"/>
      </svg>
      Chrome
    </button>
    <button class="browser-btn" data-name="VSCode">
      <span class="material-symbols-outlined text-xl" style="color:#007ACC">code</span>
      VS Code
    </button>
  </div>

</div>
</main>
<!-- Mobile Navigation Shell -->
<footer class="md:hidden fixed bottom-0 w-full h-16 bg-white/80 backdrop-blur-md flex items-center justify-around px-4 z-50 border-t border-outline-variant">
<button class="flex flex-col items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-[10px] font-bold">홈</span>
</button>
<button class="flex flex-col items-center gap-1 text-primary">
<span class="material-symbols-outlined active-tab-fill" data-icon="explore">explore</span>
<span class="text-[10px] font-bold">탐색</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span>
<span class="text-[10px] font-bold">라이브러리</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="text-[10px] font-bold">프로필</span>
</button>
</footer>

<input type="file" id="demoUploadFile" style="display: none;">
<script src="/static/js/common.js?v=es3-5"></script>
<script src="/static/js/upload.js"></script>
<script src="/static/js/search/explore.js?v=es3-3"></script>
</body>

</html>
