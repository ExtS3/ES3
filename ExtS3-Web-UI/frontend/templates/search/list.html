<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ES3 · 검색 결과</title>
<script src="/static/vendor/tailwindcss-forms-container-queries.js"></script>
<script src="/static/js/es3-theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body { font-family: 'Pretendard', 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
<link rel="stylesheet" href="/static/css/common/nav.css">
<link rel="stylesheet" href="/static/css/common/dino-loader.css">
<link rel="stylesheet" href="/static/css/common/tokens.css">
</head>
<body class="bg-surface text-on-surface antialiased">
<header id="es3-header" class="fixed"></header>
<aside id="es3-sidebar" class="fixed"></aside>
<!-- Main Content Canvas -->
<main class="md:pl-60 pt-20 min-h-screen bg-surface">
<div class="max-w-7xl mx-auto px-8 pb-12 space-y-8">
<!-- Header Section -->
<section class="flex flex-col md:flex-row md:items-end justify-between gap-4">
<div>
<nav class="flex items-center gap-2 text-xs text-on-surface-variant mb-2">
<a class="hover:text-primary" href="/search">앱 탐색</a>
<span class="material-symbols-outlined text-sm">chevron_right</span>
<span>검색 결과</span>
</nav>
<h1 class="text-3xl font-extrabold tracking-tight text-on-surface">
                        검색 결과
</h1>
</div>
</section>
<!-- Filter Chips -->
<section class="flex items-center gap-3 overflow-x-auto no-scrollbar pb-2">
<button class="flex-shrink-0 px-6 py-2 rounded-full bg-primary text-on-primary text-sm font-semibold transition-all">검색 결과</button>

</section>
<!-- Results Grid -->
<section id="results-container" class="relative z-10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <!-- list.js에 의해 동적으로 카드가 생성될 자리입니다 -->
    <div class="col-span-full">
        <div class="dino-loader">
            <div class="dino-sprite">
                <span class="dino-frame f2"></span>
                <span class="dino-frame f3"></span>
                <span class="dino-frame f4"></span>
                <span class="dino-frame f5"></span>
            </div>
            <p class="dino-loading-text">
                웹스토어에서 열심히 찾아오는 중<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
            </p>
        </div>
    </div>
</section>
<div id="search-pagination-controls" class="relative z-10 flex justify-center items-center gap-2 pt-2"></div>
</div>
</main>
<script src="/static/js/common.js?v=es3-10"></script>
<script src="/static/js/upload.js"></script>
<script src="/static/js/search/list.js"></script>
</body>
</html>
