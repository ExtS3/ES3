<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ES3 · 대시보드</title>
<script src="/static/vendor/tailwindcss-forms-container-queries.js"></script>
<script src="/static/js/es3-theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body { font-family: 'Pretendard', 'Inter', sans-serif; }
    </style>
<link rel="stylesheet" href="/static/css/common/nav.css">
<link rel="stylesheet" href="/static/css/common/tokens.css">
</head>
<body class="bg-surface text-on-surface min-h-screen">
<header id="es3-header" class="fixed"></header>
<aside id="es3-sidebar" class="fixed"></aside>
<!-- Main Content Canvas -->
<main class="md:pl-60 pt-20">
<div class="max-w-7xl mx-auto px-8 pb-12 space-y-8">
<!-- Hero Header Section -->
<section class="flex flex-col lg:flex-row lg:items-end justify-between gap-6">
<div>
<h1 class="text-3xl font-bold tracking-tight text-on-surface mb-2">대시보드</h1>
<p class="text-on-surface-variant body-md max-w-lg">저장소의 상태를 한눈에 파악하고 확장 프로그램의 라이프사이클을 관리하세요.</p>
</div>

</section>
<!-- Storage & Stats Bento Grid -->
<section class="grid grid-cols-1 md:grid-cols-4 gap-4">
<!-- Main Storage Usage (Large) -->
<div class="md:col-span-2 bg-surface-container-lowest p-6 rounded-xl relative overflow-hidden flex flex-col min-h-[220px]">
<div class="w-10 h-10 bg-primary-container text-primary rounded-lg flex items-center justify-center mb-4">
<span class="material-symbols-outlined" data-icon="database" style="font-variation-settings: 'FILL' 1;">database</span>
</div>
<div class="mt-auto">
<span class="text-sm text-on-surface-variant block">저장소 현황</span>
<div class="flex items-end gap-2">
<span id="storage-used-value" class="text-3xl font-black text-on-surface">-</span>
<span id="storage-total-value" class="text-sm font-bold text-on-surface-variant mb-1">불러오는 중</span>
</div>
<p id="storage-browser-breakdown" class="text-xs text-on-surface-variant mt-2"></p>
</div>
<div class="absolute -right-10 -bottom-10 w-48 h-48 bg-primary/5 rounded-full blur-3xl"></div>
</div>
<!-- Active Repositories Count -->
<div class="bg-surface-container-lowest p-6 rounded-xl flex flex-col">
<div class="w-10 h-10 bg-primary-container text-primary rounded-lg flex items-center justify-center mb-4">
<span class="material-symbols-outlined" data-icon="inventory_2" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
</div>
<div class="mt-auto">
<span class="text-sm text-on-surface-variant block">사용 가능한 확장 프로그램 수</span>
<span id="active-repo-count" class="text-3xl font-black text-on-surface">-</span>
</div>
</div>
<!-- Verified Items Count -->
<div class="bg-surface-container-lowest p-6 rounded-xl flex flex-col">
<div class="w-10 h-10 bg-primary-container text-primary rounded-lg flex items-center justify-center mb-4">
<span class="material-symbols-outlined" data-icon="verified" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
<div class="mt-auto">
<span class="text-sm text-on-surface-variant block">검증 완료 항목</span>
<span id="verified-item-count" class="text-3xl font-black text-on-surface">-</span>
</div>
</div>
</section>


<!-- Current Repositories Section -->
<section>
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-on-surface">현재 저장소 목록</h2>
        <a class="text-primary text-sm font-semibold hover:underline" href="/library">전체 보기</a>
    </div>
    <div id="repo-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>
</section>

</div>
</main>
<script src="/static/js/common.js?v=es3-5"></script>
<script src="/static/js/upload.js"></script>
<script src="/static/js/index.js?v=es3-1"></script>
</body>

</html>
