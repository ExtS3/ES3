<!DOCTYPE html>
<html class="light" lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ES3 · 정책 설정</title>
<script src="/static/vendor/tailwindcss-forms-container-queries.js"></script>
<script src="/static/js/es3-theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Pretendard', 'Inter', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
</style>
<link rel="stylesheet" href="/static/css/common/tokens.css">
<link rel="stylesheet" href="/static/css/common/nav.css">
</head>
<body class="bg-surface text-on-surface antialiased">
<!-- 공통 셸: common.js가 헤더/사이드바 마크업을 주입한다 -->
<header id="es3-header" class="fixed"></header>
<aside id="es3-sidebar" class="fixed"></aside>

<main class="md:pl-60 pt-20 min-h-screen">
<div class="max-w-7xl mx-auto px-8 pb-12">
  <header class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
    <div>
      <p class="text-sm font-bold text-primary mb-2">자동 심사 정책</p>
      <h1 class="text-3xl font-extrabold tracking-tight text-on-surface mb-2">정책 설정</h1>
      <p class="text-on-surface-variant">심각도 결과에 따라 자동 승인 또는 자동 거부 여부만 설정합니다.</p>
    </div>
    <div class="flex items-center gap-3">
      <a href="/admin/policy-catalog" class="inline-flex items-center gap-2 px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-sm font-bold text-on-surface hover:bg-primary-container hover:text-on-primary-container transition-colors">
        <span class="material-symbols-outlined text-base">policy</span>
        Chrome 정책 카탈로그
      </a>
      <a href="/api/admin/policy/default.json" class="inline-flex items-center gap-2 px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-sm font-bold text-on-surface hover:bg-primary-container hover:text-on-primary-container transition-colors" download>
        <span class="material-symbols-outlined text-base">data_object</span>
        기본 정책 JSON
      </a>
      <a href="/api/admin/policy/default.pdf" class="inline-flex items-center gap-2 px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-sm font-bold text-on-surface hover:bg-primary-container hover:text-on-primary-container transition-colors" download>
        <span class="material-symbols-outlined text-base">download</span>
        기본 정책 PDF
      </a>
      <button id="save-policy" class="px-4 py-2 bg-primary text-white rounded-lg text-sm font-bold hover:bg-primary-dim inline-flex items-center gap-2">
        <span class="material-symbols-outlined text-base">save</span>
        저장
      </button>
    </div>
  </header>

  <div id="status-message" class="hidden mb-6 rounded-lg px-4 py-3 text-sm font-bold"></div>

  <section class="max-w-4xl bg-surface-container-lowest rounded-xl border border-outline-variant/20 p-6">
    <div class="flex items-center gap-3 mb-6">
      <span class="material-symbols-outlined text-primary">rule_settings</span>
      <h2 class="text-xl font-black">기본 정책</h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <label class="flex items-start justify-between gap-4 bg-surface-container-low rounded-lg px-4 py-4">
        <span>
          <span class="block text-sm font-bold">Critical 자동 거부</span>
          <span class="block text-xs text-on-surface-variant mt-1">critical 심각도가 포함된 분석 결과를 자동으로 거부합니다.</span>
        </span>
        <input id="critical-auto-reject-enabled" type="checkbox" class="mt-1 rounded text-primary focus:ring-primary"/>
      </label>

      <label class="flex items-start justify-between gap-4 bg-surface-container-low rounded-lg px-4 py-4">
        <span>
          <span class="block text-sm font-bold">Low 자동 승인</span>
          <span class="block text-xs text-on-surface-variant mt-1">low 심각도만 확인된 분석 결과를 자동으로 승인합니다.</span>
        </span>
        <input id="low-auto-approve-enabled" type="checkbox" class="mt-1 rounded text-primary focus:ring-primary"/>
      </label>
    </div>

    <div class="mt-6 rounded-lg bg-surface-container-low px-4 py-3 text-sm text-on-surface-variant">
      자동 정책에 해당하지 않는 결과는 기존처럼 관리자 검토 상태로 유지됩니다.
    </div>
  </section>
</div>
</main>

<script src="/static/js/common.js?v=es3-10"></script>
<script src="/static/js/admin/policy.js?v=20260529-policy-simple"></script>
</body>
</html>
