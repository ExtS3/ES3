<!DOCTYPE html>
<html class="light" lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>검사 내역 - ES3</title>
<script src="/static/vendor/tailwindcss-forms-container-queries.js"></script>
<script src="/static/js/es3-theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/common/tokens.css">
<link rel="stylesheet" href="/static/css/common/nav.css">
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    vertical-align: middle;
  }
  body { font-family: 'Pretendard', 'Inter', sans-serif; }
</style>
</head>
<body class="bg-surface text-on-surface antialiased">
<header id="es3-header" class="fixed"></header>
<aside id="es3-sidebar" class="fixed"></aside>

<main class="md:pl-60 pt-20 min-h-screen">
  <div class="max-w-7xl mx-auto px-8 pb-12">
    <header class="mb-8 flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight text-on-surface mb-1">검사 내역</h1>
        <p class="text-on-surface-variant text-sm">확장 프로그램 및 플러그인 보안 검사 진행 상태와 완료 내역을 조회합니다.</p>
      </div>
      <div class="flex items-center gap-2">
        <span id="scan-access-badge" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-surface-container-low border border-outline-variant text-xs font-bold text-on-surface-variant">
          <span class="material-symbols-outlined text-sm">visibility</span>
          읽기 전용
        </span>
        <button id="scan-refresh-btn" type="button" class="px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-sm font-medium text-on-surface hover:bg-primary-container hover:text-on-primary-container transition-colors inline-flex items-center gap-2">
          <span class="material-symbols-outlined text-base">refresh</span>
          새로고침
        </button>
      </div>
    </header>

    <section class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-4 mb-6">
      <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-5">
        <p class="text-sm font-medium text-on-surface-variant">진행 중</p>
        <p id="scan-count-running" class="text-2xl font-black mt-2">0</p>
      </div>
      <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-5">
        <p class="text-sm font-medium text-on-surface-variant">대기</p>
        <p id="scan-count-queued" class="text-2xl font-black mt-2">0</p>
      </div>
      <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-5">
        <p class="text-sm font-medium text-on-surface-variant">검토 대기</p>
        <p id="scan-count-review" class="text-2xl font-black mt-2">0</p>
      </div>
      <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-5">
        <p class="text-sm font-medium text-on-surface-variant">승인 · 거부</p>
        <p id="scan-count-complete" class="text-2xl font-black mt-2">0</p>
      </div>
      <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-5">
        <p class="text-sm font-medium text-on-surface-variant">실패</p>
        <p id="scan-count-error" class="text-2xl font-black mt-2">0</p>
      </div>
    </section>

    <section class="bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden">
      <div class="px-5 py-4 border-b border-outline-variant flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
        <div>
          <h2 class="text-lg font-bold text-on-surface">검사 작업 목록</h2>
          <p class="text-sm text-on-surface-variant mt-1">현재는 조회 화면만 제공되며, 검사 데이터 변경은 관리자 권한 API에서만 허용됩니다.</p>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead class="bg-surface-container-low text-on-surface-variant text-xs uppercase tracking-wider font-bold">
            <tr>
              <th class="px-5 py-3">확장명</th>
              <th class="px-5 py-3">브라우저</th>
              <th class="px-5 py-3">버전</th>
              <th class="px-5 py-3">상태</th>
              <th class="px-5 py-3">현재 단계</th>
              <th class="px-5 py-3">진행률</th>
              <th class="px-5 py-3">갱신 시각</th>
              <th class="px-5 py-3 text-right hidden" data-admin-only>관리</th>
            </tr>
          </thead>
          <tbody id="scan-status-body" class="divide-y divide-outline-variant">
            <tr>
              <td colspan="7" class="px-5 py-14 text-center text-on-surface-variant">
                <div class="flex flex-col items-center gap-3">
                  <span class="material-symbols-outlined text-5xl text-on-surface-variant/40">manage_search</span>
                  <p class="text-sm font-medium">검사 내역 API 연결 전입니다.</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script src="/static/js/common.js?v=es3-11"></script>
<script src="/static/js/admin/scan_status.js?v=es3-1" defer></script>
</body>
</html>
